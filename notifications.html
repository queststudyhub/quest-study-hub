
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | QUEST Study Hub</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            margin: 0;
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #173b70;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
        }

        .notification {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 3px 12px #00000015;
        }

        .notification h2 {
            color: #173b70;
            font-size: 20px;
        }

        .notification p {
            color: #555;
        }

        .back {
            display: inline-block;
            background: #173b70;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>

<body>

    <h1>QUEST Study Hub</h1>
    <h1>Notifications</h1>

    <div class="container">

        <div class="notification">
            <h2>Exam Schedule</h2>
            <p>Important examination schedule updates will be posted here.</p>
        </div>

        <div class="notification">
            <h2>University Announcements</h2>
            <p>Important university announcements will be shared here.</p>
        </div>

        <div class="notification">
            <h2>New Study Material</h2>
            <p>Updates about new notes and past papers will appear here.</p>
        </div>

        <a href="index.html" class="back">Back to Home</a>

    </div>

</body>
</html>
