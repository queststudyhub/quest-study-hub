    <style>
        .page-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;

        }

        .page-buttons a,
        .pdf-button {
            background: #087F8C;
            color: white;
            padding: 11px 22px;
            border-radius: 6px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .page-buttons a:hover,
        .pdf-button:hover {
            background: #066570;
        }

        #pdf-viewer {
            display: none;
            background: white;
            padding: 20px;
            margin: 25px auto;
            max-width: 1000px;
            border-radius: 10px;
        }
    </style>

    <section class="materials">

        </div>
    </section>

    <div id="pdf-viewer">
        <h3>Applied Physics Lecture 1</h3>

        <button class="pdf-button" onclick="closePDF()">Close PDF</button>

        <iframe
            src="pdfs/applied-physics-lecture-1.pdf"
            width="100%"
            height="700px"
            style="border:none; margin-top:15px;">
        </iframe>
    </div>

    <script>
        function showPDF() {
            document.getElementById("pdf-viewer").style.display = "block";
        }

        function closePDF() {
            document.getElementById("pdf-viewer").style.display = "none";
        }
    </script>
